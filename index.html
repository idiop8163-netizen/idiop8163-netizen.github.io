<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Your Own Perfume</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🌸 Build Your Own Perfume 🌸</h1>

    <div class="container">

        <label>Choose a Top Note:</label>
        <select id="topNote">
            <option>Bergamot</option>
            <option>Lemon</option>
            <option>Orange</option>
            <option>Mint</option>
        </select>

        <br><br>

        <label>Choose a Middle Note:</label>
        <select id="middleNote">
            <option>Rose</option>
            <option>Jasmine</option>
            <option>Lavender</option>
            <option>Lily</option>
        </select>

        <br><br>

        <label>Choose a Base Note:</label>
        <select id="baseNote">
            <option>Vanilla</option>
            <option>Sandalwood</option>
            <option>Cedarwood</option>
            <option>Amber</option>
        </select>

        <br><br>

        <button onclick="createPerfume()">Create My Perfume</button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
